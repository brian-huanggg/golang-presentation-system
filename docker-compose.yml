# Local development infrastructure (CUR-48). Not part of the product architecture.
# Secrets come from .env (git-ignored); copy .env.example to .env first.
# Ports bind to 127.0.0.1 only so nothing is exposed beyond this machine.
# Image tags are pinned to LTS release lines (no :latest) so everyone gets the same build.
name: esg-award

services:
  mariadb:
    # MariaDB 11.8 is an LTS series
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-esg_award}
      MARIADB_USER: ${MARIADB_USER:-esg}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      # healthcheck.sh ships with the official image; --innodb_initialized waits for real readiness
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  clamav:
    # ClamAV 1.4 is an LTS series
    image: clamav/clamav:1.4.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      # persist signature DB so restarts don't re-download it
      - clamav-db:/var/lib/clamav
    healthcheck:
      # clamd answers PONG only after signatures are loaded, which can take minutes on first start
      test: ["CMD-SHELL", "echo PING | nc -w 3 localhost 3310 | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

  minio:
    # Upstream minio/minio images are no longer published, so use Chainguard's build.
    # Its free tier only offers :latest, so pin by digest to get a fixed version.
    # No healthcheck: the image has no shell or curl to run one with.
    image: cgr.dev/chainguard/minio@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set in .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
  mariadb-data:
  clamav-db:
