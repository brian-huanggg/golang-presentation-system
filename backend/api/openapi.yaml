# Source of truth for the HTTP contract (ADR 0005). Both the Go server and the
# frontend types are generated from this file; never edit generated output.
# Feature operations are added as their tickets land.
openapi: 3.0.3
info:
  title: ESG Award Site API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /auth/register:
    post:
      operationId: register
      summary: Register a Participant account (REG-001..003, REG-005, REG-006, REG-009)
      description: >
        Open to visitors. Rejected with 403 `deadline_passed` after the event
        deadline (REG-006), 400 `validation_failed` with per-field codes for
        invalid input, and 409 `employee_id_taken` when the Employee ID is already
        registered (REG-003; disclosure is accepted by REG-009).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredUser"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Log in with Employee ID and password (AUTH-001, AUTH-003, AUTH-005)
      description: >
        Open to visitors; allowed after the deadline (DDL-004). Email is never a login
        identifier (AUTH-001). Every credential failure (unknown ID, wrong password,
        malformed ID, locked account) is the same 401 `invalid_credentials` so the
        response never reveals whether an account exists or is locked (AUTH-003).
        Five consecutive wrong passwords lock the account for 5 minutes (AUTH-002);
        while locked even the correct password is refused with the same response.
        On success the response sets the
        session cookie (`HttpOnly`, `Secure`, `SameSite=Lax`) and the session token is
        renewed to prevent fixation. It also sets the readable `csrf_token` cookie
        (`Secure`, `SameSite=Lax`, not `HttpOnly`) whose value the SPA must echo in the
        `X-CSRF-Token` header on every later state-changing request (AUTH-009).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; the session cookie is set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: Log out and invalidate the session immediately (AUTH-006)
      description: >
        Idempotent: a request without a live session also returns 204, so a client
        whose session already expired can still finish logging out. The session is
        deleted from the server store before the response, and the session and
        `csrf_token` cookies are cleared. With a live session the request must carry the
        `X-CSRF-Token` header (AUTH-009); without one no token exists and none is checked.
      tags: [auth]
      security: []
      responses:
        "204":
          description: No live session remains
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: The logged-in user, or 401 when the session is missing or expired (AUTH-005)
      description: >
        A session expires after 30 minutes of inactivity or 8 hours in total,
        whichever comes first; each authenticated request restarts the idle timer but
        never the 8 hour limit. An expired or unknown session is `401 unauthenticated`.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updatePreferences
      summary: Save the preferred language (I18N-002)
      description: >
        Stores the language on the user account; it is applied by the SPA on every login.
        Unsupported values are 400 `validation_failed` (field `preferredLanguage`).
      tags: [auth]
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesRequest"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password:
    post:
      operationId: changePassword
      summary: Change the logged-in user's password (REG-007, REG-005, AUTH-007, AUTH-008)
      description: >
        Requires a session. Allowed after the deadline (DDL-004). The current password
        must be correct: otherwise 400 `validation_failed` with field `currentPassword`
        and code `password_incorrect`; the attempt counts toward the account lockout
        (AUTH-002), and while the account is locked even the correct password gets the
        same answer. The new password must satisfy the REG-005 policy (field
        `newPassword`, same codes as registration). On success all other sessions of the
        user are invalidated (AUTH-007, ADR 0019), the caller's session stays valid,
        and `mustChangePassword` is cleared (AUTH-008).
      tags: [auth]
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "409":
          description: The credentials changed concurrently; retry. Code `conflict`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /admin/teams:
    get:
      operationId: listAdminTeams
      summary: Admin lists and searches the teams of the current event year (ADM-001)
      description: >
        Requires the session of an Admin; anyone else gets 403 `forbidden`. Admins are
        not restricted by the deadline (DDL-006). Dissolved teams are never listed
        (TEAM-015). All filters are optional and combine with AND.


        `q` matches the team name as a case-insensitive substring. `track`,
        `awardCategory` and `department` match exactly. `hasIdea` is `true` for teams
        with an active Idea and `false` for teams without one. `sort` is one of `id`,
        `-id`, `name`, `-name` (a leading `-` means descending; default `id`). An
        invalid filter or paging value is 400 `validation_failed` with the parameter
        name in `field`.


        The listing is a view of other teams and is audited (AUD-001) as
        `admin.team_list` with the filters used.
      tags: [admin]
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 50
        - name: track
          in: query
          schema:
            $ref: "#/components/schemas/Track"
        - name: awardCategory
          in: query
          schema:
            $ref: "#/components/schemas/AwardCategory"
        - name: department
          in: query
          schema:
            $ref: "#/components/schemas/Department"
        - name: hasIdea
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          description: 1-based page number (default 1).
          schema:
            type: integer
        - name: size
          in: query
          description: Page size, 1 to 100 (default 20).
          schema:
            type: integer
        - name: sort
          in: query
          schema:
            type: string
      responses:
        "200":
          description: One page of teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeamPage"
        default:
          $ref: "#/components/responses/Problem"
  /teams:
    post:
      operationId: createTeam
      summary: Create a team with its roster, all or nothing (TEAM-001..008)
      description: >
        Requires a session of a Participant who is not in a team this event year
        (TEAM-001); the caller becomes the Team Leader. Admins get 403 `forbidden`
        (R-02), a participant already in a team 409 `already_in_team`, and a request
        after the deadline 403 `deadline_passed` (DDL-003).


        The team's department is the leader's (TEAM-003). `memberIds` lists the other
        members by Employee ID, 0 to 4 of them (TEAM-002, TEAM-006). Creation is
        all-or-nothing (TEAM-008): when anything is invalid, no team is created and the
        response is 400 `validation_failed` whose `errors` list every problem found. A
        problem with a listed ID has `field` `memberIds`, the offending ID in `value`,
        and one reason `code`: `invalid_format` (not 6 digits), `duplicate` (listed
        twice), `is_leader` (the caller's own ID), `not_registered` (no such
        Participant), `already_in_team` (already in a team this event year) or
        `department_mismatch` (a different department from the leader, TEAM-007).
        Other fields use `name` (`required`, `too_short`, `too_long`, `invalid_format`),
        `track` and `awardCategory` (`required`, `invalid_value`) and `memberIds`
        without a value (`too_many`). A name already used by an active team of this
        year, compared case-insensitively, is 409 `team_name_taken` (TEAM-004).
      tags: [team]
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /teams/{teamId}:
    delete:
      operationId: dissolveTeam
      summary: The Team Leader dissolves the team (TEAM-014, TEAM-015, TEAM-016)
      description: >
        Requires the session of the Team Leader of this team. The team is soft-deleted:
        hidden at once, its members are released at once, its name is free for reuse at
        once, and its Idea (if any) is soft-deleted with it. The data is removed for good
        by `cmd/purge` after 7 days. The former roster is kept in the audit record so an
        engineer can restore the team by hand within that time (TEAM-016); the API offers
        no restore. The confirmation of NFR-UX-003 is asked by the UI before this call;
        the API itself takes no confirmation field.


        A plain Team Member gets 403 `forbidden` (they can leave instead). A Participant
        who is not in the team gets 404 `team_not_found`; an Admin gets 403 `forbidden`
        (R-02). After the deadline the answer is 403 `deadline_passed` (DDL-003).
      tags: [team]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "204":
          description: Team dissolved
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /teams/{teamId}/members:
    post:
      operationId: addTeamMember
      summary: Leader adds a member by Employee ID (TEAM-010, TEAM-007, TEAM-006)
      description: >
        Requires the session of the Team Leader of this team. A Participant who is not in
        the team gets 404 `team_not_found`; a Team Member who is not the leader gets 403
        `forbidden`; an Admin gets 403 `forbidden` (R-02, ADM-005). After the deadline the
        answer is 403 `deadline_passed` (DDL-003).


        The person is checked exactly as at creation (TEAM-007). Anything wrong is 400
        `validation_failed` with one error: `field` `employeeId`, the ID in `value` and a
        `code` of `invalid_format`, `is_leader`, `not_registered`, `already_in_team` (in this
        or another team this event year) or `department_mismatch`. A team that already has 5
        people is 409 `team_full` (TEAM-006). The response is the whole team.
      tags: [team]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTeamMemberRequest"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /teams/{teamId}/members/{employeeId}:
    delete:
      operationId: removeTeamMember
      summary: Leader removes a member (TEAM-011)
      description: >
        Requires the session of the Team Leader of this team; the same 404, 403 and
        `deadline_passed` answers as adding a member. The confirmation of NFR-UX-003 is
        asked by the UI before this call; the API itself takes no confirmation field. The
        leader cannot be removed (TEAM-013): 409 `leader_cannot_be_removed`. An Employee ID
        that is not in the team is 404 `member_not_found`. The person is free at once and
        can join or create another team.
      tags: [team]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member removed
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /teams/{teamId}/leave:
    post:
      operationId: leaveTeam
      summary: A Team Member leaves their team (TEAM-012, TEAM-013)
      description: >
        Requires the session of a plain Team Member of this team. The person is free at
        once and can join or create another team. The confirmation of NFR-UX-003 is asked
        by the UI before this call; the API itself takes no confirmation field.


        The Team Leader cannot leave (TEAM-013): 409 `leader_cannot_leave`; the leader
        dissolves the team instead. A Participant who is not in the team gets 404
        `team_not_found`; an Admin gets 403 `forbidden` (R-02). After the deadline the
        answer is 403 `deadline_passed` (DDL-003).
      tags: [team]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "204":
          description: Left the team
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /teams/{teamId}/idea:
    post:
      operationId: createIdea
      summary: Upload the first file and create the team's Idea (IDEA-001..005, IDEA-010, IDEA-020)
      description: >
        Only the Team Leader or an Admin can do this (IDEA-011). A Team Member gets 403
        `forbidden`; a Participant outside the team, an unknown team and a dissolved team
        all get 404 `team_not_found`, so other teams are not revealed. A team that already
        has an Idea gets 409 `idea_exists`. After the deadline a Participant gets 403
        `deadline_passed` (DDL-003); Admins are not restricted (DDL-006). The deadline is
        judged when the upload completes, not when it started (DDL-005).


        The body is `multipart/form-data` with the text fields `title` (required, at most
        100 characters) and `summary` (optional, at most 1,000 characters) and exactly one
        `file` part. Field problems are 400 `validation_failed` with one entry per field
        in `errors` (`title` and `summary`: `required`, `too_long`; `file`:
        `invalid_file_name`, `too_long`). A body that is not that form, or that ends
        before it is complete, is 400 `invalid_request` and creates nothing (IDEA-006).


        The file must be a PPTX or PDF of at most 5 MB whose extension, declared type and
        content all agree (IDEA-002..004), and must pass the malware scan (IDEA-005). The
        rejection reasons (IDEA-007) are the problem `code`: `upload_file_empty` (422),
        `upload_file_too_large` (413), `upload_format_rejected` and
        `upload_type_mismatch` (415), `upload_content_mismatch`, `upload_macro_rejected`
        and `upload_malware_detected` (422), and `upload_scan_unavailable` (503, retry
        later). Any rejection leaves no Idea, no version and no stored file.


        On success the Idea has one version, number 1, and the response carries the
        `ETag` to send as `If-Match` on later changes (IDEA-030).
      tags: [idea]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateIdeaRequest"
      responses:
        "201":
          description: Idea created with its first version
          headers:
            ETag:
              description: Revision of the Idea, for `If-Match`.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: esg_session
      description: Opaque server-side session token (HttpOnly; the SPA never reads it).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >
        Per-session CSRF token, copied from the readable `csrf_token` cookie. Required on
        every state-changing request made with a session (AUTH-009).
  responses:
    RateLimited:
      description: >
        Too many requests from this network address (AUTH-004). Applies to every
        `/auth/*` operation, independent of the per-account lockout. Code `rate_limited`.
      headers:
        Retry-After:
          description: Seconds to wait before the next attempt.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CsrfInvalid:
      description: >
        The request belongs to a logged-in session but its `X-CSRF-Token` header is
        missing or does not equal the session's token (AUTH-009). Code
        `csrf_token_invalid`. Applies to every state-changing operation that needs a
        session; the handler does not run.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Stable machine-readable error code for the frontend.
        errors:
          type: array
          description: Per-field validation failures (code `validation_failed`).
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: JSON name of the invalid request field.
        code:
          type: string
          description: Stable code, e.g. `required`, `invalid_format`, `too_long`.
        value:
          type: string
          description: >
            The offending input value, only when `field` is a list and the code
            concerns one element (for example one Employee ID in `memberIds`).
    Department:
      type: string
      enum: [TSID, BCID, DEID, NTAD]
    Language:
      type: string
      description: BCP 47 tag offered by the UI (I18N-001).
      enum: [zh-TW, en]
    RegisterRequest:
      type: object
      required: [employeeId, fullName, department, password, preferredLanguage]
      properties:
        employeeId:
          type: string
          pattern: "^[0-9]{6}$"
          description: Exactly six digits (REG-002).
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        department:
          $ref: "#/components/schemas/Department"
        password:
          type: string
          format: password
          description: >
            Password policy (REG-005): the password is Unicode NFKC-normalized first
            (so full-width `ａｂｃ` equals `abc`), then must be at least 12
            characters (counted as Unicode characters) and at most 128 bytes; at least one uppercase letter, one
            lowercase letter and one symbol (punctuation or symbol, not a space);
            no run of 3 or more consecutive ASCII letters or digits, ascending or
            descending, letters case-insensitive (`abc`, `cba`, `123`, `321`); no
            character repeated 3 or more times in a row (`aaa`, `111`). Every
            violated rule is returned as its own `validation_failed` entry with
            field `password` and one of the codes `required`, `too_long`,
            `password_too_short`, `password_no_upper`, `password_no_lower`,
            `password_no_symbol`, `password_sequence`, `password_repeat`.
        preferredLanguage:
          $ref: "#/components/schemas/Language"
        email:
          type: string
          maxLength: 254
          description: Optional; format-checked only, never verified or unique (REG-008).
    RegisteredUser:
      type: object
      required: [employeeId, fullName, department, preferredLanguage]
      properties:
        employeeId:
          type: string
        fullName:
          type: string
        department:
          $ref: "#/components/schemas/Department"
        preferredLanguage:
          $ref: "#/components/schemas/Language"
        email:
          type: string
    LoginRequest:
      type: object
      required: [employeeId, password]
      properties:
        employeeId:
          type: string
          description: The 6-digit Employee ID. An email address is not accepted.
        password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          description: Same policy and violation codes as `RegisterRequest.password` (REG-005).
    UpdatePreferencesRequest:
      type: object
      required: [preferredLanguage]
      properties:
        preferredLanguage:
          $ref: "#/components/schemas/Language"
    SessionUser:
      type: object
      required: [employeeId, fullName, role, preferredLanguage, mustChangePassword]
      properties:
        employeeId:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [PARTICIPANT, ADMIN]
        department:
          $ref: "#/components/schemas/Department"
          description: Absent for Admin accounts.
        preferredLanguage:
          $ref: "#/components/schemas/Language"
        mustChangePassword:
          type: boolean
          description: True for a newly provisioned Admin until the password is changed (AUTH-008).
    Track:
      type: string
      enum: [smart_innovation, sustainable_development]
    AwardCategory:
      type: string
      enum: [engineering, administration, manufacturing_process, transportation, public_safety]
    CreateTeamRequest:
      type: object
      required: [name, track, awardCategory]
      properties:
        name:
          type: string
          description: 2 to 50 characters after trimming (TEAM-004).
        track:
          $ref: "#/components/schemas/Track"
        awardCategory:
          $ref: "#/components/schemas/AwardCategory"
        memberIds:
          type: array
          maxItems: 4
          description: Employee IDs of the other members; empty or absent for a team of one (TEAM-002).
          items:
            type: string
    AddTeamMemberRequest:
      type: object
      required: [employeeId]
      properties:
        employeeId:
          type: string
          description: Employee ID of the person to add (6 digits).
    TeamMember:
      type: object
      required: [employeeId, fullName, role]
      properties:
        employeeId:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [LEADER, MEMBER]
    Team:
      type: object
      required: [id, eventYear, name, track, awardCategory, department, members]
      properties:
        id:
          type: integer
          format: int64
        eventYear:
          type: integer
        name:
          type: string
        track:
          $ref: "#/components/schemas/Track"
        awardCategory:
          $ref: "#/components/schemas/AwardCategory"
        department:
          $ref: "#/components/schemas/Department"
        members:
          type: array
          description: The leader first, then the members in the order they were listed.
          items:
            $ref: "#/components/schemas/TeamMember"
    TeamSummary:
      type: object
      required: [id, eventYear, name, track, awardCategory, department, leader, memberCount, hasIdea]
      properties:
        id:
          type: integer
          format: int64
        eventYear:
          type: integer
        name:
          type: string
        track:
          $ref: "#/components/schemas/Track"
        awardCategory:
          $ref: "#/components/schemas/AwardCategory"
        department:
          $ref: "#/components/schemas/Department"
        leader:
          $ref: "#/components/schemas/TeamMember"
        memberCount:
          type: integer
          description: People on the team, leader included (1 to 5).
        hasIdea:
          type: boolean
    AdminTeamPage:
      type: object
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamSummary"
        total:
          type: integer
          format: int64
          description: Number of teams matching the filters, across all pages.
        page:
          type: integer
        size:
          type: integer
    CreateIdeaRequest:
      type: object
      required: [title, file]
      properties:
        title:
          type: string
          maxLength: 100
        summary:
          type: string
          maxLength: 1000
        file:
          type: string
          format: binary
          description: A PPTX or PDF file of at most 5 MB.
    IdeaVersion:
      type: object
      required: [versionNo, uploadedBy, uploadedAt, originalFileName, sizeBytes]
      properties:
        versionNo:
          type: integer
        uploadedBy:
          type: string
          description: Employee ID of the uploader.
        uploadedAt:
          type: string
          description: ISO-8601 time with a `+08:00` offset (Asia/Taipei).
        originalFileName:
          type: string
        sizeBytes:
          type: integer
          format: int64
    Idea:
      type: object
      required: [id, teamId, title, summary, currentVersion]
      properties:
        id:
          type: integer
          format: int64
        teamId:
          type: integer
          format: int64
        title:
          type: string
        summary:
          type: string
          description: Empty when none was given.
        currentVersion:
          $ref: "#/components/schemas/IdeaVersion"
